spring.application.name=demo
server.port=${SERVER_PORT:${PORT:8080}}
# Load-bearing for CORS, not only for logging and link building. Spring decides "same origin"
# by comparing the Origin header against the request URL it reconstructs, and the deployed
# panel relies on that: it is served from the same host that proxies this backend, so its
# calls are same-origin and never reach the allow-list. Behind the proxy the reconstruction is
# only correct while the forwarded headers are honoured -- drop this and same-origin calls
# start failing CORS. See docs/deployment.md, "Public address and request path".
server.forward-headers-strategy=framework
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema before Flyway

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}
app.mail.from-address=${MAIL_FROM_ADDRESS:no-reply@localhost}
app.mail.from-name=${MAIL_FROM_NAME:RateMyProfApp}

# Comma separated, each entry "email" or "email:Display Name". These accounts are
# created and promoted to ADMIN at startup. The default is the project's own
# administrators so that an unset environment variable cannot lock everyone out
# of the admin API, which has no other recovery path.
app.auth.admin-bootstrap-emails=${ADMIN_BOOTSTRAP_EMAILS:unzhz@student.kit.edu:Alparslan,ugoqu@student.kit.edu:Mustafa,ugjlu@student.kit.edu:Luis,uzvqy@student.kit.edu:Yavuz,uiolj@student.kit.edu:Philipp,uchbm@student.kit.edu:Enno}
# Comma separated addresses. These administrators may also moderate other
# administrator accounts; everyone else still gets 409 against an admin target.
# Listing an address here grants nothing on its own -- it must be an administrator
# too, which is what admin-bootstrap-emails above is for. This is not a role: the
# API keeps reporting ADMIN for these accounts and exposes the distinction as the
# separate isSuperAdmin field on /admin/auth/me.
app.auth.admin-superuser-emails=${ADMIN_SUPERUSER_EMAILS:unzhz@student.kit.edu}
app.auth.otp-ttl=${AUTH_OTP_TTL:PT5M}
# The lifetime belongs to the API that issued the session, not to the account. A session
# from POST /admin/auth/login expires on the admin schedule; one from POST /auth/login
# lasts a year for everyone, administrators included. AUTH_STUDENT_SESSION_TTL is the
# former name of the app value and is still read when the new one is unset.
app.auth.admin-session-ttl=${AUTH_ADMIN_SESSION_TTL:P1D}
app.auth.app-session-ttl=${AUTH_APP_SESSION_TTL:${AUTH_STUDENT_SESSION_TTL:P365D}}
app.auth.rate-limit.window=${AUTH_RATE_LIMIT_WINDOW:PT15M}
app.auth.rate-limit.hmac-key=${AUTH_RATE_LIMIT_HMAC_KEY:}
app.auth.rate-limit.request-email=${AUTH_RATE_LIMIT_REQUEST_EMAIL:3}
app.auth.rate-limit.request-ip=${AUTH_RATE_LIMIT_REQUEST_IP:20}
app.auth.rate-limit.login-email=${AUTH_RATE_LIMIT_LOGIN_EMAIL:10}
app.auth.rate-limit.login-ip=${AUTH_RATE_LIMIT_LOGIN_IP:30}

# What is left over for callers that are not same-origin. The deployed panel is same-origin
# and is not covered by this list; see server.forward-headers-strategy above.
app.cors.allowed-origins=${ADMIN_FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

ipinfo.token=${IPINFO_TOKEN:}
geoapify.api.key=${GEOAPIFY_API_KEY:}

# How long an administrative field edit stays reversible from its audit entry.
app.audit.revert-window=${AUDIT_REVERT_WINDOW:P7D}

# GitLab issue integration. Unset means disabled: POST /reports/{id}/gitlab-issue
# answers 503 and GET /system/status reports gitlabEnabled=false. The token is read
# from the environment and is never returned by any endpoint.
app.gitlab.base-url=${GITLAB_BASE_URL:}
app.gitlab.project-id=${GITLAB_PROJECT_ID:}
app.gitlab.token=${GITLAB_TOKEN:}
app.gitlab.timeout=${GITLAB_TIMEOUT:PT10S}
