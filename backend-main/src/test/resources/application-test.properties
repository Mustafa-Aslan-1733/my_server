spring.datasource.url=jdbc:h2:mem:admin-api;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.locations=classpath:db/migration/h2
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
debug=false
logging.level.org.hibernate.SQL=INFO

app.auth.admin-bootstrap-emails=admin@student.kit.edu
app.auth.admin-superuser-emails=super@student.kit.edu
app.auth.admin-session-ttl=P1D
app.auth.app-session-ttl=P365D
app.auth.rate-limit.hmac-key=test-rate-limit-hmac-key-with-more-than-32-characters
app.auth.rate-limit.window=PT15M
app.auth.rate-limit.request-email=3
app.auth.rate-limit.request-ip=20
app.auth.rate-limit.login-email=10
app.auth.rate-limit.login-ip=30
app.mail.from-address=test@example.invalid
app.cors.allowed-origins=http://localhost:5173
