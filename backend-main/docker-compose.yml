services:
  postgres:
    image: postgres:16
    container_name: "${POSTGRES_CONTAINER_NAME:-backend-postgres}"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches the login code instead of mailing it. Signing in needs a one-time password
  # delivered by e-mail and there is no other way in, so without something listening on
  # SMTP a local run is an API nobody can authenticate against: POST /auth/request-login
  # answers 500 "Could not send login code" and discards the code. A catcher rather than
  # real SMTP credentials because it costs the person running this nothing -- no account
  # anywhere, no secret in a file -- and because it can be verified from here.
  #
  # Pinned, like every other image this project runs: a floating :latest would change what
  # a reviewer sees on a day nobody touched the repository.
  #
  # 1025 is SMTP, and only the backend uses it. 8025 is the web inbox a person opens.
  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: "${MAILPIT_CONTAINER_NAME:-backend-mailpit}"
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: "${BACKEND_CONTAINER_NAME:-backend-app}"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      AUTH_RATE_LIMIT_HMAC_KEY: local-development-rate-limit-key-32chars
      # Two lines, not six. application.properties already defaults smtp.auth and
      # starttls.enable to false and the credentials to empty, which is exactly what an
      # unauthenticated catcher wants -- so only the address has to be said. These belong
      # in this block rather than in a .env: there is no env_file here, so a .env reaches
      # YAML substitution only and never the container.
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      # Who is an administrator here. Unset, this falls back to the project's own six
      # addresses from application.properties -- correct for the deployment, useless for
      # anyone else running this, who would sign in successfully and then collect 403 on
      # every panel screen. One neutral address instead, so the stack is usable by whoever
      # started it. Append your own with a comma; the ":Display Name" suffix is optional.
      ADMIN_BOOTSTRAP_EMAILS: admin@student.kit.edu
    ports:
      - "8080:8080"

volumes:
  postgres-data:
